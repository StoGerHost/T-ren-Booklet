<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türenbooklet – Mein Wissen rund um Türen</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1d1d1f;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  header a {
    color: #fff;
    background: #0a84ff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  header a:hover {
    background: #006fe0;
  }
  .viewer-container {
    flex: 1;
    width: 100%;
    height: 100%;
  }
  .viewer-container embed {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .fallback {
    padding: 24px;
    text-align: center;
    font-size: 0.95rem;
    color: #444;
  }
</style>
</head>
<body>

<header>
  <h1>📘 Mein Wissen rund um Türen – Stand 5/2026</h1>
</header>

<div class="viewer-container">
  <embed
    src="tueren-booklet.pdf"
    type="application/pdf"
    title="Türenbooklet PDF-Viewer" />
</div>

<noscript>
  <p class="fallback">
    Bitte öffne das PDF direkt über
    <a href="tueren-booklet.pdf">diesen Link</a>.
  </p>
</noscript>

</body>
</html>
